
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="mybikes.css">
    <title>DIALED - My Bikes</title>
</head>
<body>
    <nav>
        <img src="images/dialed.png" alt="DIALED Logo">
        <a href="overview.html">Overview</a>
        <a href="mybikes.html">My Bikes</a>
        <a href="bikebuilder.html">Bike Builder</a>
        <a href="maintenance.html">Maintenance</a>
        <a href="profile.html">Profile</a>
    </nav>

    <main>
        <h1>YOUR BIKES</h1>

        <h2>Featured Bike</h2>

        <div class="featured-bike">
            <img src="images/bike.png" alt="Marin Alpine Trail 1">

            <div class="bike-info">
                <h3 class="model">Alpine Trail 1</h3>

                <div class="bike-specs">
                    <p class="make">Marin</p>
                    <p class="category">Enduro</p>
                    <p class="wheels">Mullet</p>
                    <span class="suspension">Full Suspension</span>
                </div>
            </div>
        </div>

        <section class="other-bikes">
            <h2>Other Bikes</h2>

            <div class="bike-grid">
                <div class="bike-card">
                    <img src="images/bike.png" alt="Bike">

                    <div class="bike-info">
                        <h3 class="model">Another Bike</h3>

                        <div class="bike-card-specs">
                            <p class="make">Manufacturer</p>
                            <p class="category">Discipline</p>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>
</body>
</html>
