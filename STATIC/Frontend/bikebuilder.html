<!DOCTYPE html>
<html lang="en">
    <head>
        <link rel="stylesheet" href="bikebuilder.css">
        <title>DIALED - Bike Builder</title>
    </head>
    <body>
        <nav>
             <img src="images/dialed.png" alt="DIALED Logo">
            <a href="overview.html">Overview</a>
            <a href="mybikes.html">My Bikes</a>
            <a href="bikebuilder.html">Bike Builder</a>
            <a href="maintenance.html">Maintenance</a>
            <a href="profile.html">Profile</a>
        </nav>
        <main>
            <h1>DREAM GARAGE</h1>
            <section>
                <h2>Build Your Dream Rig</h2>
            </section>
            <section class="bike-preview">
              <img src="images/bike.png" alt="Bike Preview">
               <div class="bike-info">
                <h3>Current Build</h3>
                <h3 class="model">Alpine Trail 1</h3>
                </div>
            </section>
            <section class="components">
                <h2>Components</h2>
                <div class="component-options">
                    <div class="component-item">
                        <h3>Frame</h3>
                        <select>
                            <option value="frame">Frame</option>
                        </select>
                    </div>
                    <div class="component-item">
                        <h3>Fork</h3>
                        <select>
                            <option value="fork">Fork</option>
                        </select>
                    </div>
                    <div class="component-item">
                        <h3>Shock</h3>
                        <select>
                            <option value="shock">Shock</option>
                        </select>
                    </div>
                    <div class="component-item">
                        <h3>Drivetrain</h3>
                        <select>
                            <option value="drivetrain">Drivetrain</option>
                        </select>
                    </div>
                    <div class="component-item">
                        <h3>Wheels</h3>
                        <select>
                            <option value="wheels">Wheels</option>
                        </select>
                    </div>
                    <div class="component-item">
                        <h3>Tyres</h3>
                        <select>
                            <option value="tyres">Tyres</option>
                        </select>
                    </div>
                    <div class="component-item brakes">
                        <h3>Brakes</h3>
                        <select>
                            <option value="brakes">Brakes</option>
                        </select>
                    </div>
                </div>
            </section>
        </main>
    </body>
</html>
